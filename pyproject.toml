[project]
name = "lazy-depends"
dynamic = ["version"]
description = "Concurrent and lazy async dependency injection for FastAPI"
readme = "README.md"
requires-python = ">=3.11"
authors = [
    { name = "Maxime De Pachtere", email = "maxime.depachtere@gmail.com" },
]
keywords = ["fastapi", "dependency-injection", "async", "concurrent", "lazy"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: Web Environment",
    "Framework :: AsyncIO",
    "Framework :: FastAPI",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: OS Independent",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3 :: Only",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Programming Language :: Python :: 3.14",
    "Topic :: Internet :: WWW/HTTP",
    "Topic :: Software Development :: Libraries",
    "Topic :: Software Development :: Libraries :: Python Modules",
    "Typing :: Typed",
]
dependencies = [
    # 0.140 removed the internals lazy_depends hooks into (get_body_field,
    # Dependant.is_coroutine_callable): capped until the solver is ported
    "fastapi >=0.114.0, <0.140",
]
urls = { Repository = "https://github.com/mde-pach/lazy-depends", Issues = "https://github.com/mde-pach/lazy-depends/issues" }

[project.optional-dependencies]
dev = [
    "aiosqlite",
    "httpx",
    "asgi-lifespan",
    "pytest",
    "pytest-asyncio",
    "ruff",
    "mypy",
    "pre-commit",
]

[build-system]
requires = ["setuptools>=64", "setuptools-scm>=8"]
build-backend = "setuptools.build_meta"

[tool.setuptools.packages.find]
where = ["."]
include = ["lazy_depends*"]

[tool.setuptools.package-data]
lazy_depends = ["py.typed"]

[tool.setuptools_scm]
version_scheme = "guess-next-dev"
local_scheme = "no-local-version"

[tool.ruff]
target-version = "py311"
line-length = 100

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
ignore = ["E501"]  # line length handled by formatter

[tool.mypy]
files = ["lazy_depends"]
python_version = "3.11"
warn_return_any = true
warn_unused_configs = true
ignore_missing_imports = true
